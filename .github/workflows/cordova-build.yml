name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - name: Install Android Build Tools
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --sdk_root=$ANDROID_HOME "build-tools;33.0.2" "platforms;android-33"

      - name: Build Web Application
        run: |
          npm ci
          npm run build

      - name: Prepare Cordova Assets & Direct HD Icon & Splash Screen
        run: |
          mkdir -p www res

      - name: Install Cordova CLI & Build Android APK
        run: |
          npm install -g cordova
          cordova platform add android@12.0.1
          cordova build android
